# Ticket 31: local first line of defence against committing secrets; CI's
# `trufflehog` job is the real gate. TruffleHog and lefthook come from Homebrew,
# and `lefthook install` is run once by hand (see README): deliberately no npm
# `prepare` script, so nothing here runs inside `npm ci` or the image build.
pre-commit:
  commands:
    trufflehog:
      # --since-commit HEAD plus --branch HEAD scans just the staged changes
      # (without --branch it also walks every other ref, stashes included),
      # with the same strictness as CI: verified, unknown and unverified
      # results all block.
      run: trufflehog git file://. --since-commit HEAD --branch HEAD --results=verified,unknown,unverified --fail --no-update
