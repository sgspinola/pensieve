# Ticket 33: Trivy secret-scan exceptions for the `build` job's image scan
# (https://trivy.dev/latest/docs/scanner/secret/#configuration).
#
# Custom rules add detectors Trivy lacks built in; allow rules record false
# positives. Every allow rule needs a reason and an expiry in its
# `description` ("<reason>; expires YYYY-MM-DD"). Trivy can't enforce the
# expiry itself, so review and delete expired rules. Never allow a real
# credential: rotate it instead.
#
# Example:
#   - id: some-dependency-test-key
#     description: "test fixture key in <package>; expires 2027-01-01"
#     path: ".*/node_modules/<package>/test/.*"
allow-rules: []

rules:
  # Trivy has no built-in rule for connection strings, and DATABASE_URL is
  # this app's one real secret. Matches any scheme://user:password@ URL.
  - id: url-embedded-credentials
    category: general
    title: URL with embedded credentials
    severity: CRITICAL
    regex: '\b[a-z][a-z0-9+.-]*://[^:@/\s"''`]+:(?P<secret>[^@/\s"''`]+)@[^\s"''`]+'
    secret-group-name: secret
    keywords:
      - "://"
