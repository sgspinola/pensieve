# Ticket 63: the infrastructure checks, called by ci.yml's `iac` job (its
# header has the rules every gate follows). The check is named `iac / iac`.
# The caller grants `id-token: write` and names the plan's two secrets:
# they're `plan` Environment secrets, which a called job sees only when its
# caller hands them down (ci.yml's `iac` comment has why).
name: IaC

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      BUDGET_EMAIL:
        required: false

permissions:
  contents: read

jobs:
  # Ticket 47: every Terraform root config under infra/ is fmt-checked,
  # validated without a backend, tested against mocked providers (ticket 48)
  # and linted (infra/.tflint.hcl pins the AWS ruleset). On PRs from this
  # repository's own branches, the prod config is also planned, inside the
  # `plan` Environment: AWS via OIDC as the
  # read-only plan role (the only role that trusts that Environment), and
  # Cloudflare with a read-only Zone+Tunnel token held as an Environment
  # secret. Forks and Dependabot run no plan and get no Environment, so they
  # never hold either credential. Every job runs on every change, so pushes
  # run the checks too, with no Environment.
  #
  # Dependabot is excluded by `github.actor`, the same test GitHub uses to
  # withhold secrets: its runs (and their re-runs) get no Environment secret,
  # but a maintainer's push to its branch plans like any other PR. The
  # condition appears twice, in `environment:` and PLAN_ELIGIBLE, because
  # `environment:` can't read `env`; keep the two identical.
  #
  # Nothing here may leak state values into this public repository: the plan
  # text goes only to the run summary (where Terraform masks sensitive
  # values), no plan file is written, and Terraform runs in containers that
  # receive only the variables passed with -e, so TF_LOG can't reach it.
  # arm64, because the lockfiles carry darwin-arm64 and linux-arm64 checksums.
  iac:
    name: iac
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') && 'plan' || '' }}
    permissions:
      contents: read
      # Permissions can't be conditional. Outside the `plan` Environment the
      # token's `sub` matches no role's trust policy (oidc.tf), and fork PRs
      # never get one.
      id-token: write
    env:
      # Bump tag and digest together by hand (Dependabot doesn't read images
      # in workflow files). Keep the Terraform tag equal to
      # infra/.terraform-version (checked below).
      TERRAFORM_IMAGE: hashicorp/terraform:1.16.5@sha256:c7926feace05d0f7e73542842bf3945924e955a1f782cf000ccbb8d18fa42d77
      TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.64.0@sha256:1c595f42d794c32c45a6ea8b58655fd66433d4ca3b1bc631c574a48d120bd19f
      PLAN_ELIGIBLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Terraform version
        run: |
          want=$(cat infra/.terraform-version)
          got=${TERRAFORM_IMAGE#*:}; got=${got%@*}
          if [ "$want" != "$got" ]; then
            echo "::error::TERRAFORM_IMAGE is $got but infra/.terraform-version says $want"
            exit 1
          fi
      - name: terraform fmt
        run: docker run --rm -v "$PWD:/repo" -w /repo "$TERRAFORM_IMAGE" fmt -check -recursive -diff infra
      - name: terraform validate
        run: |
          for dir in infra/*/; do
            echo "::group::$dir"
            docker run --rm -v "$PWD:/repo" -w "/repo/$dir" "$TERRAFORM_IMAGE" init -backend=false -input=false
            docker run --rm -v "$PWD:/repo" -w "/repo/$dir" "$TERRAFORM_IMAGE" validate
            echo "::endgroup::"
          done
      # Ticket 48: each config's tests/*.tftest.hcl, against a mocked
      # provider, so they need no credentials and create nothing.
      - name: terraform test
        run: |
          for dir in infra/*/; do
            [ -d "$dir/tests" ] || continue
            echo "::group::$dir"
            docker run --rm -v "$PWD:/repo" -w "/repo/$dir" "$TERRAFORM_IMAGE" test
            echo "::endgroup::"
          done
      - name: tflint
        env:
          # tflint --init downloads the plugin from GitHub's API; unauthenticated, it's rate-limited.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo -e GITHUB_TOKEN --entrypoint sh "$TFLINT_IMAGE" -c '
            set -e
            tflint --init --config=/repo/infra/.tflint.hcl
            for dir in infra/*/; do
              echo "::group::$dir"
              tflint --chdir="$dir" --config=/repo/infra/.tflint.hcl
              echo "::endgroup::"
            done'
      - name: terraform plan (prod)
        id: plan
        if: env.PLAN_ELIGIBLE == 'true'
        env:
          # The AWS provider and the S3 backend assume this role themselves
          # from the web identity token file.
          AWS_ROLE_ARN: ${{ vars.PLAN_ROLE_ARN }}
          AWS_REGION: eu-north-1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A `plan` Environment secret, not a variable: the run log prints
          # step env values and masks only secrets. Not sensitive in itself,
          # but it stays out of this public repository and its logs (the
          # Terraform variable is sensitive, so the plan doesn't print it).
          TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
        run: .github/scripts/iac-plan.sh
      - name: Summary
        if: always()
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: .github/scripts/iac-summary.sh
