# Ticket 41: the database's own CI (spec 13, "`db.yml` workflow"). It builds
# and scans the DB image (db/Dockerfile), and proves that every migration
# applies to an empty database and on top of the last release's (ticket 45),
# that no schema change lacks its migration (ticket 45), and that the roles
# and grants work (ticket 42). Unlike ci.yml, it only triggers when a database source
# changes (the paths below), so app-only changes don't pay for it.
# That's also why its jobs aren't required checks in the develop/main
# rulesets: a required check whose workflow never triggered would block the
# PR forever. A failing run still shows on the PR; it just doesn't block the
# merge on its own. Dependency bumps do trigger it (ticket 51): the DB image
# bundles npm packages (postgres, drizzle-orm, the RDS signer), and a
# release that bumps one must republish the image.
#
# Same baseline as ci.yml: least-privilege permissions, actions pinned to a
# full commit SHA, checkout without persisted credentials, scanners run as
# digest-pinned images, a timeout and a short $GITHUB_STEP_SUMMARY.
name: DB

# The migrations, the migrator and its connection helper (and, under db/,
# the image's own build-context ignore file), the CA bundle, drizzle-kit's
# config, what the image's bundles are built from (the dependencies and
# tsconfig.json's path alias) and this workflow. The root .dockerignore is
# the app image's only.
on:
  pull_request:
    branches: [develop, main]
    paths: &db-sources
      - "drizzle/**"
      - "db/**"
      - "src/db/**"
      - "certs/**"
      - "drizzle.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/db.yml"
  push:
    branches: [develop, main]
    paths: *db-sources

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

# One run per workflow + ref. Superseded PR runs are cancelled; pushes to
# develop/main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ticket 45: a schema change committed without its migration. drizzle-kit
  # compares src/db/schema.ts with the committed snapshots in drizzle/meta/
  # (not the SQL, so a hand-added breaking marker doesn't matter), and writes
  # a new migration if they differ. Any file it writes fails the job. No
  # database: generate never connects, but drizzle.config.ts requires a URL.
  db-drift:
    name: db-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - name: drizzle-kit generate
        env:
          DATABASE_URL: postgres://unused@127.0.0.1:1/unused
        # stdin closed, so a rename prompt fails instead of waiting.
        run: npx drizzle-kit generate < /dev/null
      - name: Check nothing was generated
        id: check
        run: |
          changed=$(git status --porcelain -- drizzle)
          if [ -n "$changed" ]; then
            {
              echo "files<<EOF"
              echo "$changed"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::error::src/db/schema.ts doesn't match the committed migrations: run npm run db:generate and commit the result"
            exit 1
          fi
      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          FILES: ${{ steps.check.outputs.files }}
        run: |
          if [ "$OUTCOME" = success ]; then
            echo "### db-drift :white_check_mark: schema.ts matches the committed migrations" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### db-drift :x: schema.ts has changes with no committed migration" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$FILES" ]; then
              fence='```'
              printf '%s\n%s\n%s\n' "$fence" "$FILES" "$fence" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  # The arm64 DB image, built natively on an arm64 runner, then scanned as
  # image.yml's build and trivy jobs (called by ci.yml) scan the app image:
  # embedded secrets (every
  # layer plus the image config, with trivy-secret.yaml's custom rule), then
  # fixable vulnerabilities with .trivyignore's exceptions. Any finding fails
  # the job before upload-artifact; SARIF goes to Code Scanning either way.
  # The migrator is one esbuild bundle, which Trivy can't see into, so the
  # vulnerability scan covers the distroless base's Debian packages. The npm
  # packages bundled into it (drizzle-orm, postgres, the RDS signer) also ship
  # in the app image, whose scan in image.yml's trivy job does see them. It
  # also writes the image's SBOM (ticket 51), which publish-db attests.
  db-image:
    name: db-image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No layer or vulnerability-DB cache: the workflow runs rarely enough
      # that a cold build and a fresh DB download are fine.
      - name: Build
        run: docker build --platform linux/arm64 --file db/Dockerfile --tag pensieve-db:ci .
      - name: Save image
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          docker save pensieve-db:ci -o "$RUNNER_TEMP/image/pensieve-db-image.tar"
      - name: Trivy secret scan
        run: >
          docker run --rm -v "$RUNNER_TEMP/image:/scan:ro" -v "$PWD:/repo" "$TRIVY_IMAGE"
          image --input /scan/pensieve-db-image.tar
          --scanners secret --image-config-scanners secret
          --secret-config /repo/trivy-secret.yaml
          --exit-code 1 --format sarif --output /repo/trivy-secret.sarif
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-secret.sarif') != ''
        # A fork PR's token can't write security events; don't fail on that.
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-secret.sarif
          category: Secrets
      - name: Trivy vulnerability scan
        run: >
          docker run --rm -v "$RUNNER_TEMP/image:/scan:ro" -v "$PWD:/repo" "$TRIVY_IMAGE"
          image --input /scan/pensieve-db-image.tar --no-progress
          --db-repository public.ecr.aws/aquasecurity/trivy-db:2
          --scanners vuln --ignore-unfixed --ignorefile /repo/.trivyignore
          --exit-code 1 --format sarif --output /repo/trivy-vuln.sarif
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-vuln.sarif') != ''
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-vuln.sarif
          category: Container SCA
      # Ticket 51: the DB image's CycloneDX SBOM, which publish-db attests.
      # The image has no node_modules, so it lists the npm packages esbuild
      # bundled into the migrator and bootstrap (Trivy can't see into a
      # bundle), the image's Debian packages (which Trivy can) and the Node
      # runtime (a tarball install neither sees; the image's entrypoint is
      # `node`, so it reports its own version). The
      # bundle is rebuilt here only for esbuild's metafile; the lockfile pins
      # the versions the image's own `npm ci` installed. Every bundled
      # package must be in `npm sbom`'s output, or the step fails.
      - uses: ./.github/actions/setup-node-deps
      - name: SBOM
        id: sbom
        run: |
          # A package.json that fails to read must fail the step, not drop
          # the package from the list (the check below only sees the list).
          set -o pipefail
          npm run build:db -- --metafile="$RUNNER_TEMP/db-meta.json" --log-level=warning
          # Each bundled file's package root (its innermost node_modules/<name>),
          # then that package's name@version, which is npm sbom's bom-ref.
          jq -r '.inputs | keys[]' "$RUNNER_TEMP/db-meta.json" \
            | sed -nE 's#^(.*node_modules/(@[^/]+/)?[^/]+)/.*#\1#p' | sort -u \
            | while read -r dir; do jq -r '"\(.name)@\(.version)"' "$dir/package.json" || exit 1; done \
            | sort -u > "$RUNNER_TEMP/db-bundled.txt"
          npm sbom --sbom-format cyclonedx --omit dev > "$RUNNER_TEMP/npm.cdx.json"
          docker run --rm -v "$RUNNER_TEMP/image:/scan:ro" -v "$RUNNER_TEMP:/out" "$TRIVY_IMAGE" \
            image --input /scan/pensieve-db-image.tar --pkg-types os \
            --format cyclonedx --output /out/os.cdx.json
          node_version=$(docker run --rm pensieve-db:ci --version | sed 's/^v//')
          mkdir -p "$RUNNER_TEMP/sbom"
          # Trivy's document (describing the image, which it names after the
          # tarball's path), plus Node and the bundled npm components with
          # their dependency edges among themselves. The image's own entry
          # gains Node and the npm packages the project depends on directly.
          jq -n --rawfile bundled "$RUNNER_TEMP/db-bundled.txt" --arg node "$node_version" \
            --slurpfile npm "$RUNNER_TEMP/npm.cdx.json" --slurpfile os "$RUNNER_TEMP/os.cdx.json" '
            ($bundled | split("\n") | map(select(. != ""))) as $want
            | [$npm[0].components[] | select(."bom-ref" as $r | $want | index($r))] as $found
            | if ($found | length) != ($want | length) then
                error("bundled but missing from npm sbom: \($want - [$found[]."bom-ref"] | join(", "))")
              else . end
            | {"bom-ref": "pkg:generic/node@\($node)", type: "platform", name: "node",
               version: $node, purl: "pkg:generic/node@\($node)"} as $runtime
            | ([$npm[0].dependencies[] | select(.ref == $npm[0].metadata.component."bom-ref")
                | .dependsOn[] | select(. as $d | $want | index($d))]) as $direct
            | $os[0]
            | .metadata.component.name = "pensieve-db"
            | .metadata.component."bom-ref" as $root
            | .components += [$runtime] + $found
            | .dependencies |= map(if .ref == $root then .dependsOn += [$runtime."bom-ref"] + $direct else . end)
            | .dependencies += [$npm[0].dependencies[]
                | select(.ref as $r | $want | index($r))
                | .dependsOn |= map(select(. as $d | $want | index($d)))]
            ' > "$RUNNER_TEMP/sbom/sbom.cdx.json"
          {
            echo "node=$node_version"
            echo "npm=$(wc -l < "$RUNNER_TEMP/db-bundled.txt" | tr -d ' ')"
            echo "os=$(jq '[.components[] | select(.purl // "" | startswith("pkg:deb/"))] | length' "$RUNNER_TEMP/sbom/sbom.cdx.json")"
          } >> "$GITHUB_OUTPUT"
      # Only reached when both scans passed: the 1-day hand-off to db-apply
      # and, on main, publish-db.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pensieve-db-image
          path: ${{ runner.temp }}/image/pensieve-db-image.tar
          retention-days: 1
          if-no-files-found: error
      # Kept 90 days, like the app's SBOM.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pensieve-db-sbom
          path: ${{ runner.temp }}/sbom/sbom.cdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Summary
        if: always()
        env:
          SBOM_NODE: ${{ steps.sbom.outputs.node }}
          SBOM_NPM: ${{ steps.sbom.outputs.npm }}
          SBOM_OS: ${{ steps.sbom.outputs.os }}
        run: |
          count() { [ -s "$1" ] && jq '[.runs[].results[]] | length' "$1" || echo "no SARIF"; }
          secrets=$(count trivy-secret.sarif)
          vulns=$(count trivy-vuln.sarif)
          icon=$([ "$secrets" = 0 ] && [ "$vulns" = 0 ] && echo ":white_check_mark:" || echo ":x:")
          echo "### db-image $icon linux/arm64 DB image; Trivy secret findings: $secrets, fixable vulnerabilities: $vulns; SBOM: Node ${SBOM_NODE:-?}, ${SBOM_NPM:-?} bundled npm + ${SBOM_OS:-?} Debian packages" >> "$GITHUB_STEP_SUMMARY"

  # Every migration applied from scratch by the built image's migrator, the
  # way production runs it, against a fresh Postgres. Drizzle's bookkeeping
  # table must then hold one row per journal entry.
  #
  # Ticket 45: then the real upgrade path, in a second database. The
  # previous release's migrations (main's drizzle/, or on a release, main
  # before the push), applied with drizzle-kit, then the image's migrator on
  # top with ALLOW_BREAKING=true (.github/scripts/db-upgrade-path.sh). A
  # migration that only works on an empty database fails here.
  db-apply:
    name: db-apply
    needs: db-image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    services:
      postgres:
        # Multi-arch index digest; bump tag and digest together by hand
        # (Dependabot doesn't read images in workflow files).
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: pensieve
          POSTGRES_PASSWORD: pensieve
          POSTGRES_DB: pensieve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pensieve -d pensieve"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # A fresh throwaway service container per run, not a secret.
      DATABASE_URL: postgres://pensieve:pensieve@localhost:5432/pensieve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pensieve-db-image
          path: ${{ runner.temp }}/image
      # drizzle-kit, for the upgrade path's previous release.
      - uses: ./.github/actions/setup-node-deps
      - name: Load image
        run: docker load -i "$RUNNER_TEMP/image/pensieve-db-image.tar"
      - name: Migrate (DB image)
        run: docker run --rm --network host -e DATABASE_URL pensieve-db:ci
      - name: Check every migration was recorded
        id: check
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          expected=$(jq '.entries | length' drizzle/meta/_journal.json)
          applied=$(docker exec "$POSTGRES_CONTAINER" \
            psql -U pensieve -d pensieve -tAc 'select count(*) from drizzle.__drizzle_migrations')
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "applied=$applied" >> "$GITHUB_OUTPUT"
          if [ "$applied" != "$expected" ]; then
            echo "::error::$applied migration(s) recorded, but the journal lists $expected"
            exit 1
          fi
      - name: Upgrade path
        id: upgrade
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          BASE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && github.event.before || 'main' }}
        run: .github/scripts/db-upgrade-path.sh
      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          APPLIED: ${{ steps.check.outputs.applied || '?' }}
          EXPECTED: ${{ steps.check.outputs.expected || '?' }}
          UPGRADE_BASE: ${{ steps.upgrade.outputs.base || '?' }}
          UPGRADE_FROM: ${{ steps.upgrade.outputs.from || '?' }}
          UPGRADE_APPLIED: ${{ steps.upgrade.outputs.applied || '?' }}
        run: |
          icon=$([ "$OUTCOME" = success ] && echo ":white_check_mark:" || echo ":x:")
          echo "### db-apply $icon $APPLIED of $EXPECTED migration(s) applied to an empty database by the DB image; upgraded from main's $UPGRADE_BASE ($UPGRADE_FROM, by drizzle-kit) to $UPGRADE_APPLIED by the DB image" >> "$GITHUB_STEP_SUMMARY"

  # Ticket 42: the roles-and-grants bootstrap (db/bootstrap.sql) run as a
  # stand-in for the RDS master user, then the migrations as the migrator,
  # then what the app role can and can't do (db/bootstrap.test.ts). ci.yml's
  # unit job runs the same test with the rest of the suite.
  db-grants:
    name: db-grants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # Multi-arch index digest; bump tag and digest together by hand
        # (Dependabot doesn't read images in workflow files).
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: pensieve
          POSTGRES_PASSWORD: pensieve
          POSTGRES_DB: pensieve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pensieve -d pensieve"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # A throwaway service container, not a secret. The superuser is needed:
      # the test creates roles and a database per run.
      DATABASE_URL: postgres://pensieve:pensieve@localhost:5432/pensieve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - name: Grants test
        run: npx vitest run db/bootstrap.test.ts --reporter=default --reporter=json --outputFile=vitest-results.json
      - name: Summary
        if: always()
        run: |
          if [ -f vitest-results.json ]; then
            jq -r '"### db-grants \(if .success then ":white_check_mark:" else ":x:" end) \(.numPassedTests) passed, \(.numFailedTests) failed"' \
              vitest-results.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### db-grants :x: Vitest did not run" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Ticket 51 (spec 13, "publish-db"): a push to main that changed a database
  # source (this workflow's path filter) publishes the DB image to its own
  # `pensieve-db` repository, through the publish-image action shared with
  # ci.yml's `publish` (its header has the mechanics). The DB image is
  # released independently of the app, on releases that touch its inputs
  # (the DB image isn't built reproducibly, so each such release publishes,
  # even one that only edits this workflow). If a release's run fails and
  # isn't re-run, the next release that touches no DB input won't publish
  # it: re-run the failed job. It needs
  # every job above, so nothing unscanned or untested is published; add any
  # new job to `needs` too. deploy-db verifies
  # the signature against
  # https://github.com/sgspinola/pensieve/.github/workflows/db.yml@refs/heads/main
  # (issuer https://token.actions.githubusercontent.com).
  publish-db:
    name: publish-db
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [db-drift, db-image, db-apply, db-grants]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC: the ECR push role (which trusts only refs/heads/main) and
      # cosign's signing certificate.
      id-token: write
    steps:
      # Only to load the local action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pensieve-db-image
          path: ${{ runner.temp }}/image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pensieve-db-sbom
          path: ${{ runner.temp }}/sbom
      - uses: ./.github/actions/publish-image
        with:
          summary-label: publish-db
          repository: pensieve-db
          image: ${{ runner.temp }}/image/pensieve-db-image.tar
          sbom: ${{ runner.temp }}/sbom/sbom.cdx.json
          role-arn: ${{ vars.ECR_PUSH_ROLE_ARN }}
