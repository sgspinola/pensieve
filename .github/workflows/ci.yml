# Ticket 30: the single workflow that gates every change into develop/main
# (spec: backlog/specs/10-ci-pipeline.md). Gate jobs run in parallel, and
# the main ruleset requires each one by its check name (plus
# `release-source`; protect-develop requires no checks). Adding or renaming
# a gate therefore means updating the required checks too, or the new name
# never blocks a merge. A job that calls a reusable workflow reports one
# check per called job, named `<caller> / <callee>` (`iac / iac`,
# `image / build`, `image / trivy`, `image / e2e`). Every job must also be
# in `publish`'s `needs` (ticket 50), or a release could publish before it
# passes.
#
# Ticket 63: this file orchestrates; self-contained areas live elsewhere.
# - .github/workflows/iac.yml (called by `iac`): Terraform checks, prod plan
# - .github/workflows/image.yml (called by `image`): build, trivy, e2e
# - .github/scripts/: CI-only shell too long for a `run:` block
# - .github/actions/upload-sarif: SARIF to Code Scanning, with its count
# - .github/actions/setup-node-deps: the shared Node bootstrap
# - .github/actions/publish-image: the release's push and signing
# A caller job grants the most its called jobs need. Only `iac` passes
# secrets (see its comment).
# Concurrency and `publish` stay here: deploys verify the signature against
# this file's identity.
#
# Baseline every job follows: least-privilege permissions (read-only here,
# extra scopes granted per job), third-party actions pinned to a full commit
# SHA with a version comment, checkout without persisted credentials, the
# shared Node bootstrap (.github/actions/setup-node-deps) in jobs that need
# Node, a timeout, and a short $GITHUB_STEP_SUMMARY.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# One run per workflow + ref. Superseded PR runs are cancelled; pushes to
# develop/main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - name: ESLint
        run: npm run lint
      - name: actionlint
        # The image bundles shellcheck, so `run:` scripts are checked too.
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: hadolint
        # The app image and the DB image (ticket 41).
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint Dockerfile db/Dockerfile
      - name: shellcheck
        # Ticket 63: actionlint checks only inline `run:` blocks, not the
        # scripts they call. -x follows each script's `source`.
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          -x .github/scripts/*.sh scripts/*.sh scripts/lib/*.sh
      - name: Summary
        run: |
          echo "### lint :white_check_mark: ESLint, actionlint, hadolint and shellcheck passed" >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: ./.github/actions/setup-node-deps
      - run: npm run typecheck
      - name: Summary
        run: |
          echo "### typecheck :white_check_mark: next typegen + tsc --noEmit passed" >> "$GITHUB_STEP_SUMMARY"

  # Ticket 32: SAST and SCA. With SEMGREP_APP_TOKEN, `semgrep ci` lets the
  # Semgrep dashboard's Code and Supply Chain policies decide what blocks.
  # Fork and Dependabot PRs get no repository secrets, so they fall back to
  # `semgrep scan` with fixed rulesets, blocking on any finding.
  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `semgrep ci` diffs a PR against its merge base.
          fetch-depth: 0
          persist-credentials: false
      - name: Semgrep
        id: semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -n "$SEMGREP_APP_TOKEN" ]; then
            echo "mode=semgrep ci (dashboard policies)" >> "$GITHUB_OUTPUT"
            semgrep ci --sarif-output=semgrep.sarif
          else
            echo "mode=semgrep scan (fallback rulesets, no token)" >> "$GITHUB_OUTPUT"
            semgrep scan --error --metrics=off --sarif-output=semgrep.sarif \
              --config p/default --config p/typescript --config p/react \
              --config p/nextjs --config p/owasp-top-ten
          fi
      - name: Upload Semgrep SARIF
        id: sarif
        if: always()
        uses: ./.github/actions/upload-sarif
        with:
          sarif-file: semgrep.sarif
          category: Semgrep
      - name: Summary
        if: always()
        env:
          MODE: ${{ steps.semgrep.outputs.mode || 'did not run' }}
          OUTCOME: ${{ steps.semgrep.outcome }}
          FINDINGS: ${{ steps.sarif.outputs.findings }}
        run: |
          if [ -n "$FINDINGS" ]; then
            icon=$([ "$OUTCOME" = success ] && echo ":white_check_mark:" || echo ":x:")
            echo "### semgrep $icon $MODE, $FINDINGS finding(s) reported" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### semgrep :x: $MODE, no SARIF produced" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Ticket 32: a CycloneDX SBOM of the production dependencies, i.e. what
  # ships in the image, kept for 90 days.
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: ./.github/actions/setup-node-deps
      - name: npm sbom
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Summary
        run: |
          n=$(jq '.components | length' sbom.cdx.json)
          echo "### sbom :white_check_mark: CycloneDX, $n production components" >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # Multi-arch index digest; bump tag and digest together by hand
        # (Dependabot doesn't read images in workflow files). image.yml's
        # `e2e` runs the same service: bump the two together.
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: pensieve
          POSTGRES_PASSWORD: pensieve
          POSTGRES_DB: pensieve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pensieve -d pensieve"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # A throwaway service container, not a secret. The superuser is needed:
      # src/test/db.ts creates and drops a database per test run.
      DATABASE_URL: postgres://pensieve:pensieve@localhost:5432/pensieve
    steps:
      - *checkout
      - uses: ./.github/actions/setup-node-deps
      # The tests don't use this database: src/test/db.ts creates and
      # migrates a fresh one per run with drizzle-orm's migrator. This step
      # proves the drizzle-kit path (`npm run db:migrate`) applies cleanly too.
      - name: Migrate (drizzle-kit)
        run: npm run db:migrate
      - name: Vitest
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json
      - name: Summary
        if: always()
        run: |
          if [ -f vitest-results.json ]; then
            jq -r '"### unit \(if .success then ":white_check_mark:" else ":x:" end) \(.numPassedTests) passed, \(.numFailedTests) failed, \(.numTotalTests) total"' \
              vitest-results.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### unit :x: Vitest did not run" >> "$GITHUB_STEP_SUMMARY"
          fi

  docs-build:
    name: docs-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: ./.github/actions/setup-node-deps
      - run: npm run docs:build
      - name: Summary
        run: |
          echo "### docs-build :white_check_mark: VitePress site built" >> "$GITHUB_STEP_SUMMARY"

  # Ticket 31: TruffleHog over just the commits under test: the PR's range,
  # or a push's before..after. History older than that was scanned when it
  # landed, and GitHub secret scanning covers it continuously. Fails on
  # verified, unknown and unverified results alike: an internal credential
  # that can't be verified still blocks. False positives get an inline
  # `trufflehog:ignore` comment on the offending line.
  # Releases (a PR into main, and the push its merge makes) scan the
  # release's files instead: every commit in them already passed this scan
  # on its way into develop, and walking main's whole range again would
  # re-flag commits from before this scan existed, whose lines the ignore
  # comments now cover but which history can't change.
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog
        env:
          SINCE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # The PR's base branch, or the pushed branch.
          TARGET: ${{ github.base_ref || github.ref_name }}
          TRUFFLEHOG_IMAGE: trufflesecurity/trufflehog:3.97.9@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db
        run: .github/scripts/trufflehog.sh
      - name: Upload TruffleHog SARIF
        id: sarif
        if: always()
        uses: ./.github/actions/upload-sarif
        with:
          sarif-file: trufflehog.sarif
          category: Secrets
      - name: Summary
        if: always()
        env:
          FINDINGS: ${{ steps.sarif.outputs.findings }}
        run: |
          if [ -n "$FINDINGS" ]; then
            icon=$([ "$FINDINGS" -eq 0 ] && echo ":white_check_mark:" || echo ":x:")
            echo "### trufflehog $icon TruffleHog: $FINDINGS finding(s)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### trufflehog :x: TruffleHog produced no SARIF" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Required by the main ruleset: releases reach main only from develop, and
  # only from this repository (a fork's branch can also be named "develop").
  release-source:
    name: release-source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check head branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" = "develop" ] && [ "$HEAD_REPO" = "$REPO" ]; then
            echo "### release-source :white_check_mark: $HEAD_REPO:$HEAD_REF" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### release-source :x: PRs into main must come from $REPO:develop, not $HEAD_REPO:$HEAD_REF" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::PRs into main must come from develop (got $HEAD_REPO:$HEAD_REF)"
            exit 1
          fi

  # Ticket 47's Terraform checks and prod plan; the job's comment in
  # iac.yml has the details. The plan's credentials are `plan` Environment
  # secrets. A called job sees only the secrets its caller hands down, its
  # own Environment's included, so the two are passed by name. This job has
  # no Environment, so it passes empty values; in the called job, the `plan`
  # Environment's secrets take their place. The Environment is still chosen
  # in iac.yml, so forks and Dependabot still get none. (Not `inherit`:
  # Semgrep blocks it, since it would hand down every repository secret.)
  iac:
    name: iac
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/iac.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}

  # Tickets 33-35: build, secret-scan, vulnerability-scan and e2e-test the
  # app image (image.yml). `publish` releases the image it uploads.
  image:
    name: image
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/image.yml

  # Ticket 50 (spec 12, "`publish` job"): a push to main is a release, and
  # puts the app image in ECR, signed, through the shared publish-image
  # action (ticket 51; the mechanics and why are in its header). It needs
  # every job above, so nothing untested or unscanned is published. Add any
  # new job to `needs` too. (release-source runs only on PRs into main, and a
  # skipped need would skip this job, so it isn't listed.) It isn't a gate:
  # it never runs on a PR, so no ruleset requires it.
  #
  # A release that didn't change the app builds the same config digest
  # (.dockerignore, SOURCE_DATE_EPOCH), so the action pushes nothing and
  # sha-* tags mark real app versions. Deploys verify the signature against
  # https://github.com/sgspinola/pensieve/.github/workflows/ci.yml@refs/heads/main
  # (issuer https://token.actions.githubusercontent.com).
  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, semgrep, sbom, unit, docs-build, trufflehog, iac, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC: the ECR push role (which trusts only refs/heads/main) and
      # cosign's signing certificate.
      id-token: write
    steps:
      # Only to load the local action.
      - *checkout
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pensieve-image
          path: ${{ runner.temp }}/image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom
      - uses: ./.github/actions/publish-image
        with:
          summary-label: publish
          repository: pensieve
          image: ${{ runner.temp }}/image/pensieve-image.tar
          sbom: ${{ runner.temp }}/sbom/sbom.cdx.json
          role-arn: ${{ vars.ECR_PUSH_ROLE_ARN }}
