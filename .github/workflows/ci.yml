# Ticket 30: the single workflow that gates every change into develop/main
# (spec: backlog/specs/10-ci-pipeline.md). Ticket 38: a first `changes` job
# works out which areas a change touched, and each job runs only when its
# inputs did (its `if:`). The final `gate` job needs every other job and is
# the only check the develop/main rulesets require (plus `release-source` on
# main). To add or rename a job, add it to `gate`'s `needs`, not to the
# rulesets: a job missing from that list never blocks a merge.
#
# Baseline every job follows: least-privilege permissions (read-only here,
# extra scopes granted per job), third-party actions pinned to a full commit
# SHA with a version comment, checkout without persisted credentials, the
# shared Node bootstrap (.github/actions/setup-node-deps) in jobs that need
# Node, a timeout, and a short $GITHUB_STEP_SUMMARY.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  # Shared by the build job's secret scan and the trivy job's vulnerability scan.
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

# One run per workflow + ref. Superseded PR runs are cancelled; pushes to
# develop/main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ticket 38: one output per job, "true" when that job's inputs changed
  # (spec 10, "Path-conditional jobs"); trivy and e2e follow `build`, which
  # they need. Adding a job means an output here, an `area` line below, an
  # `if:` on the job and an entry in `gate`'s `needs`. The diff is the PR against its merge
  # base, or a push's before..after. Everything runs on a push to main (a
  # release), on any change to the workflows or composite actions, and
  # whenever the diff can't be computed. Paths no job lists (README,
  # backlog/, ...) run only trufflehog, which doesn't depend on this job.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.areas.outputs.lint }}
      typecheck: ${{ steps.areas.outputs.typecheck }}
      semgrep-sast: ${{ steps.areas.outputs.semgrep-sast }}
      semgrep-sca: ${{ steps.areas.outputs.semgrep-sca }}
      sbom: ${{ steps.areas.outputs.sbom }}
      unit: ${{ steps.areas.outputs.unit }}
      docs-build: ${{ steps.areas.outputs.docs-build }}
      build: ${{ steps.areas.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changed areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # Three dots for a PR: its changes since the merge base, whatever
          # has landed on the base branch since. Two for a push.
          RANGE: >-
            ${{ github.event_name == 'pull_request'
              && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
              || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          all=false
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            all=true reason="push to main"
          elif ! files=$(git diff --name-only "$RANGE" 2>/dev/null); then
            # e.g. a first push, whose `before` is all zeros, or a force-push
            # whose old commit is gone.
            all=true reason="no diff for $RANGE"
          elif grep -qE '^\.github/(workflows|actions)/' <<<"$files"; then
            all=true reason="workflow or composite action changed"
          fi

          # Path patterns (extended regexes over repo-relative paths).
          # tsc and ESLint cover every TypeScript/JavaScript file in the repo
          # (root configs, docs/.vitepress), not just src/ and e2e/.
          src='^src/'
          e2e='^e2e/'
          pkg='^(package\.json|package-lock\.json|\.npmrc|\.nvmrc)$'
          tsconfig='^tsconfig[^/]*\.json$'
          scripts='\.(ts|tsx|mts|cts|js|jsx|mjs|cjs)$'
          dockerfiles='(^|/)Dockerfile[^/]*$|(^|/)\.dockerignore$'
          app_image='^Dockerfile$|^\.dockerignore$|^next\.config\.ts$|^playwright\.config\.ts$|^trivy-secret\.yaml$|^\.trivyignore$|^certs/'

          area() { # area <output> <pattern>
            local value=false
            if [ "$all" = true ] || grep -qE "$2" <<<"$files"; then value=true; fi
            echo "$1=$value" >> "$GITHUB_OUTPUT"
            echo "| $1 | $value |" >> "$GITHUB_STEP_SUMMARY"
          }

          {
            echo "### changes: ${reason:-$(grep -c . <<<"$files") changed file(s) in $RANGE}"
            echo "| job | runs |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          area lint "$src|$e2e|$scripts|$tsconfig|$pkg|$dockerfiles"
          area typecheck "$src|$e2e|$scripts|$tsconfig|$pkg"
          area semgrep-sast "$src|$dockerfiles|^infra/"
          area semgrep-sca "$pkg"
          area sbom "$pkg"
          area unit "$src|^drizzle/|$tsconfig|$pkg|^vitest\.config\.ts$|^drizzle\.config\.ts$"
          area docs-build "^docs/|$pkg"
          area build "$src|$e2e|^drizzle/|$tsconfig|$pkg|$app_image"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - name: ESLint
        run: npm run lint
      - name: actionlint
        # The image bundles shellcheck, so `run:` scripts are checked too.
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: hadolint
        run: >
          docker run --rm -i
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          < Dockerfile
      - name: Summary
        run: |
          echo "### lint :white_check_mark: ESLint, actionlint and hadolint passed" >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - run: npm run typecheck
      - name: Summary
        run: |
          echo "### typecheck :white_check_mark: next typegen + tsc --noEmit passed" >> "$GITHUB_STEP_SUMMARY"

  # Ticket 32: SAST and SCA, split by ticket 38 so each runs on its own
  # paths. With SEMGREP_APP_TOKEN, `semgrep ci` lets the Semgrep dashboard's
  # policies decide what blocks: Code here, Supply Chain in semgrep-sca. Fork
  # and Dependabot PRs get no repository secrets, so this job falls back to
  # `semgrep scan` with fixed rulesets, blocking on any finding.
  semgrep-sast:
    name: semgrep-sast
    needs: changes
    if: needs.changes.outputs.semgrep-sast == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `semgrep ci` diffs a PR against its merge base.
          fetch-depth: 0
          persist-credentials: false
      - name: Semgrep Code
        id: semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -n "$SEMGREP_APP_TOKEN" ]; then
            echo "mode=semgrep ci --code (dashboard policies)" >> "$GITHUB_OUTPUT"
            semgrep ci --code --sarif-output=semgrep.sarif
          else
            echo "mode=semgrep scan (fallback rulesets, no token)" >> "$GITHUB_OUTPUT"
            semgrep scan --error --metrics=off --sarif-output=semgrep.sarif \
              --config p/default --config p/typescript --config p/react \
              --config p/nextjs --config p/owasp-top-ten
          fi
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        # A fork PR's token can't write security events; don't fail on that.
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast
      - name: Summary
        if: always()
        env:
          MODE: ${{ steps.semgrep.outputs.mode || 'did not run' }}
          OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          if [ -s semgrep.sarif ]; then
            n=$(jq '[.runs[].results[]] | length' semgrep.sarif)
            icon=$([ "$OUTCOME" = success ] && echo ":white_check_mark:" || echo ":x:")
            echo "### semgrep-sast $icon $MODE, $n finding(s) reported" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### semgrep-sast :x: $MODE, no SARIF produced" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Ticket 38: Supply Chain needs the Semgrep App; there's no tokenless mode. Without the
  # token (fork and Dependabot PRs) this job can't scan, so it says so and
  # passes, as the single semgrep job's fallback never covered dependencies
  # either. Those PRs' dependency vulnerabilities are still caught by trivy,
  # which also runs on package-file changes and scans the image's npm bundle.
  semgrep-sca:
    name: semgrep-sca
    needs: changes
    if: needs.changes.outputs.semgrep-sca == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `semgrep ci` diffs a PR against its merge base.
          fetch-depth: 0
          persist-credentials: false
      - name: Semgrep Supply Chain
        id: semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -n "$SEMGREP_APP_TOKEN" ]; then
            echo "mode=semgrep ci --supply-chain (dashboard policies)" >> "$GITHUB_OUTPUT"
            semgrep ci --supply-chain --sarif-output=semgrep.sarif
          else
            echo "mode=not scanned (Supply Chain needs SEMGREP_APP_TOKEN)" >> "$GITHUB_OUTPUT"
            echo "::warning::No SEMGREP_APP_TOKEN: Semgrep Supply Chain skipped; trivy covers the image's dependencies"
          fi
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        # A fork PR's token can't write security events; don't fail on that.
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sca
      - name: Summary
        if: always()
        env:
          MODE: ${{ steps.semgrep.outputs.mode || 'did not run' }}
          OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          if [ -s semgrep.sarif ]; then
            n=$(jq '[.runs[].results[]] | length' semgrep.sarif)
            icon=$([ "$OUTCOME" = success ] && echo ":white_check_mark:" || echo ":x:")
            echo "### semgrep-sca $icon $MODE, $n finding(s) reported" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$OUTCOME" = success ]; then
            echo "### semgrep-sca :warning: $MODE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### semgrep-sca :x: $MODE, no SARIF produced" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Ticket 32: a CycloneDX SBOM of the production dependencies, i.e. what
  # ships in the image, kept for 90 days.
  sbom:
    name: sbom
    needs: changes
    if: needs.changes.outputs.sbom == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - name: npm sbom
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Summary
        run: |
          n=$(jq '.components | length' sbom.cdx.json)
          echo "### sbom :white_check_mark: CycloneDX, $n production components" >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: unit
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pensieve
          POSTGRES_PASSWORD: pensieve
          POSTGRES_DB: pensieve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pensieve -d pensieve"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # A throwaway service container, not a secret. The superuser is needed:
      # src/test/db.ts creates and drops a database per test run.
      DATABASE_URL: postgres://pensieve:pensieve@localhost:5432/pensieve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      # The tests don't use this database: src/test/db.ts creates and
      # migrates a fresh one per run with drizzle-orm's migrator. This step
      # proves the drizzle-kit path (`npm run db:migrate`) applies cleanly too.
      - name: Migrate (drizzle-kit)
        run: npm run db:migrate
      - name: Vitest
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json
      - name: Summary
        if: always()
        run: |
          if [ -f vitest-results.json ]; then
            jq -r '"### unit \(if .success then ":white_check_mark:" else ":x:" end) \(.numPassedTests) passed, \(.numFailedTests) failed, \(.numTotalTests) total"' \
              vitest-results.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### unit :x: Vitest did not run" >> "$GITHUB_STEP_SUMMARY"
          fi

  docs-build:
    name: docs-build
    needs: changes
    if: needs.changes.outputs.docs-build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - run: npm run docs:build
      - name: Summary
        run: |
          echo "### docs-build :white_check_mark: VitePress site built" >> "$GITHUB_STEP_SUMMARY"

  # Ticket 31: TruffleHog over just the commits under test: the PR's range,
  # or a push's before..after. History older than that was scanned when it
  # landed, and GitHub secret scanning covers it continuously. Fails on
  # verified, unknown and unverified results alike: an internal credential
  # that can't be verified still blocks. False positives get an inline
  # `trufflehog:ignore` comment on the offending line.
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog
        env:
          SINCE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # --branch pins the scan to the commit under test: without it,
          # TruffleHog walks every fetched ref, including other PR branches.
          docker run --rm -v "$PWD:/repo" \
            trufflesecurity/trufflehog:3.97.9@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db \
            git file:///repo --since-commit "$SINCE" --branch "$HEAD_SHA" \
            --results=verified,unknown,unverified --fail --fail-on-scan-errors --no-update --sarif \
            > trufflehog.sarif
      - name: Upload SARIF
        if: always() && hashFiles('trufflehog.sarif') != ''
        # A fork PR's token can't write security events; don't fail on that.
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trufflehog.sarif
          category: trufflehog-repo
      - name: Summary
        if: always()
        run: |
          if [ -s trufflehog.sarif ]; then
            n=$(jq '[.runs[].results[]] | length' trufflehog.sarif)
            icon=$([ "$n" -eq 0 ] && echo ":white_check_mark:" || echo ":x:")
            echo "### trufflehog $icon TruffleHog: $n finding(s)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### trufflehog :x: TruffleHog produced no SARIF" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Required by the main ruleset: releases reach main only from develop, and
  # only from this repository (a fork's branch can also be named "develop").
  release-source:
    name: release-source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check head branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" = "develop" ] && [ "$HEAD_REPO" = "$REPO" ]; then
            echo "### release-source :white_check_mark: $HEAD_REPO:$HEAD_REF" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### release-source :x: PRs into main must come from $REPO:develop, not $HEAD_REPO:$HEAD_REF" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::PRs into main must come from develop (got $HEAD_REPO:$HEAD_REF)"
            exit 1
          fi

  # Ticket 33: the deployable arm64 image, built natively on an arm64 runner.
  # It's scanned for embedded secrets before upload, so a leaking image is
  # never downloadable from this public repository: Trivy covers every
  # layer's files plus the image config (ENV, labels, build-arg history),
  # with a custom rule for credentials in URLs (trivy-secret.yaml). Any
  # finding fails the job before upload-artifact; SARIF goes up either way.
  build:
    name: build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repository allows only GitHub-owned actions, so buildx runs from
      # the runner's CLI, its layer cache persisted with actions/cache. Every
      # run restores the newest cache (PRs can read develop's); only pushes
      # save one, so PR runs don't each add a full layer cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: buildx-${{ runner.arch }}-${{ github.sha }}
          restore-keys: buildx-${{ runner.arch }}-
      - name: Build
        run: |
          docker buildx create --driver docker-container --use
          docker buildx build --platform linux/arm64 --tag pensieve:ci --load \
            --cache-from "type=local,src=$RUNNER_TEMP/buildx-cache" \
            --cache-to "type=local,dest=$RUNNER_TEMP/buildx-cache-new,mode=max" .
          # Replace rather than merge, so the cache doesn't grow without bound.
          rm -rf "$RUNNER_TEMP/buildx-cache"
          mv "$RUNNER_TEMP/buildx-cache-new" "$RUNNER_TEMP/buildx-cache"
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: buildx-${{ runner.arch }}-${{ github.sha }}
      - name: Save image
        run: docker save pensieve:ci -o "$RUNNER_TEMP/pensieve-image.tar"
      - name: Trivy secret scan
        run: >
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" -v "$PWD:/repo" "$TRIVY_IMAGE"
          image --input /scan/pensieve-image.tar
          --scanners secret --image-config-scanners secret
          --secret-config /repo/trivy-secret.yaml
          --exit-code 1 --format sarif --output /repo/trivy-secret.sarif
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-secret.sarif') != ''
        # A fork PR's token can't write security events; don't fail on that.
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-secret.sarif
          category: trivy-image-secrets
      # Only reached when the scan passed. 1 day is the hand-off to later
      # jobs (the image scan and e2e, tickets 34 and 35); on develop pushes
      # it's the deployable artifact.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pensieve-image
          path: ${{ runner.temp }}/pensieve-image.tar
          retention-days: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') && 14 || 1 }}
          if-no-files-found: error
      - name: Summary
        if: always()
        run: |
          count() { [ -s "$1" ] && jq '[.runs[].results[]] | length' "$1" || echo "no SARIF"; }
          trivy=$(count trivy-secret.sarif)
          icon=$([ "$trivy" = 0 ] && echo ":white_check_mark:" || echo ":x:")
          echo "### build $icon linux/arm64 image; Trivy secret findings: $trivy" >> "$GITHUB_STEP_SUMMARY"

  # Ticket 34: known vulnerabilities in the built image, both Debian packages
  # and the npm packages in the standalone bundle (secrets were scanned in
  # `build`). Fails on any severity, but only when a fix exists. Reviewed
  # exceptions go in .trivyignore, with a reason and an `exp:` date Trivy
  # enforces. Trivy can't see the distroless Node binary itself (it isn't a
  # dpkg package); Dependabot's base-image digest bumps keep that current.
  trivy:
    name: trivy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pensieve-image
          path: ${{ runner.temp }}/image
      # One vulnerability DB per day: restored from the cache, or pulled from
      # the public.ecr.aws mirror. As in `build`, only pushes save it (PRs can
      # read develop's), and it's saved before the scan so no image-layer
      # cache ends up in it.
      - name: Cache key
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: db-cache
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.day.outputs.date }}
          restore-keys: trivy-db-
      - name: Download vulnerability DB
        if: steps.db-cache.outputs.cache-hit != 'true'
        run: >
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/cache" "$TRIVY_IMAGE"
          image --cache-dir /cache --download-db-only --no-progress
          --db-repository public.ecr.aws/aquasecurity/trivy-db:2
      - if: github.event_name == 'push' && steps.db-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.day.outputs.date }}
      - name: Trivy vulnerability scan
        run: >
          docker run --rm -v "$RUNNER_TEMP/image:/scan:ro" -v "$RUNNER_TEMP/trivy-cache:/cache"
          -v "$PWD:/repo" "$TRIVY_IMAGE"
          image --input /scan/pensieve-image.tar --cache-dir /cache --skip-db-update
          --scanners vuln --ignore-unfixed --ignorefile /repo/.trivyignore
          --exit-code 1 --format sarif --output /repo/trivy-vuln.sarif
      - name: Upload SARIF
        if: always() && hashFiles('trivy-vuln.sarif') != ''
        # A fork PR's token can't write security events; don't fail on that.
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-vuln.sarif
          category: trivy-image-vulns
      - name: Summary
        if: always()
        run: |
          if [ -s trivy-vuln.sarif ]; then
            n=$(jq '[.runs[].results[]] | length' trivy-vuln.sarif)
            icon=$([ "$n" -eq 0 ] && echo ":white_check_mark:" || echo ":x:")
            echo "### trivy $icon $n fixable vulnerabilit$([ "$n" -eq 1 ] && echo y || echo ies) in the image" >> "$GITHUB_STEP_SUMMARY"
            # Each result's message is "Key: value" lines (Package, Severity, ...).
            # The first 20 are listed; the rest are in Code Scanning.
            jq -r '[.runs[].results[]][:20][]
              | (.message.text | [split("\n")[] | capture("^(?<key>[^:]+): (?<value>.*)$")] | from_entries) as $m
              | "- `\(.ruleId)` \($m.Severity): \($m.Package) \($m["Installed Version"]), fixed in \($m["Fixed Version"])"' \
              trivy-vuln.sarif >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### trivy :x: Trivy produced no SARIF" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Ticket 35: the Playwright suite against the built image itself, so a
  # broken standalone output, Dockerfile, migration entrypoint or hydration
  # fails here rather than in production. Every container shares the host
  # network, so the browser reaches the app at http://localhost: the
  # production session cookie is `Secure`, which Chrome only accepts over
  # plain HTTP on localhost. That's also why Playwright runs from its official
  # image via `docker run` rather than as the job container: a job container
  # has no Docker CLI to load and start the app, nor the app on localhost.
  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pensieve
          POSTGRES_PASSWORD: pensieve
          POSTGRES_DB: pensieve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pensieve -d pensieve"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # A fresh throwaway service container per run, not a secret. Migrations
      # and the app run as its superuser; least-privilege roles are spec 11.
      DATABASE_URL: postgres://pensieve:pensieve@localhost:5432/pensieve
      # Must match the @playwright/test version in package.json.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Playwright and the global setup's DB seeding come from node_modules,
      # mounted into the Playwright container below (both linux/arm64).
      - uses: ./.github/actions/setup-node-deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pensieve-image
          path: ${{ runner.temp }}/image
      - name: Load image
        run: docker load -i "$RUNNER_TEMP/image/pensieve-image.tar"
      - name: Migrate (image entrypoint)
        run: docker run --rm --network host -e DATABASE_URL pensieve:ci migrate.cjs
      - name: Start app
        run: |
          docker run -d --name app --network host -e DATABASE_URL pensieve:ci
          # 200 only once the app is up and its database answers.
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 http://localhost:3000/api/health
      # --reporter overrides the config's `list` for CI only: html for the
      # failure artifact, json for the summary.
      - name: Playwright
        run: >
          docker run --rm --network host --ipc=host
          -v "$PWD:/work" -w /work
          -e CI -e DATABASE_URL
          -e PLAYWRIGHT_BASE_URL=http://localhost:3000
          -e PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/results.json
          -e PLAYWRIGHT_HTML_OPEN=never
          "$PLAYWRIGHT_IMAGE"
          npx playwright test --reporter=list,html,json
      - name: App logs
        if: failure()
        run: docker logs app
      # No if-no-files-found: error, since a failure before Playwright ran
      # leaves no report; the app logs above cover that case.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
      - name: Summary
        if: always()
        run: |
          if [ -f test-results/results.json ]; then
            # .errors holds global setup/teardown failures, which count no test.
            jq -r '(.errors | length) as $errors | .stats | "### e2e \(if .unexpected == 0 and $errors == 0 then ":white_check_mark:" else ":x:" end) against the built image: \(.expected) passed, \(.unexpected) failed, \(.flaky) flaky, \(.skipped) skipped, \($errors) global error(s)"' \
              test-results/results.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### e2e :x: Playwright did not run (see the image, migrate and app steps)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Ticket 38: the one check the rulesets require. It runs after every other
  # job, whatever their outcome, and fails if any of them failed or was
  # cancelled. A skipped job (its inputs didn't change, or a job it needs was
  # skipped) counts as passing. A job missing from `needs` here never blocks.
  gate:
    name: gate
    if: always()
    needs:
      - changes
      - lint
      - typecheck
      - semgrep-sast
      - semgrep-sca
      - sbom
      - unit
      - docs-build
      - trufflehog
      - release-source
      - build
      - trivy
      - e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| job | result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS"
          } > results.md
          blocking=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<<"$NEEDS")
          if [ -n "$blocking" ]; then
            { echo "### gate :x: blocked by $blocking"; cat results.md; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Failed or cancelled: $blocking"
            exit 1
          fi
          { echo "### gate :white_check_mark: no job failed or was cancelled"; cat results.md; } >> "$GITHUB_STEP_SUMMARY"
