# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    # Ticket 32: matches .npmrc's min-release-age (npm couldn't resolve a
    # younger version anyway). Security updates ignore cooldowns.
    cooldown:
      default-days: 7
    ignore:
      # Ticket 27: typescript-eslint supports `typescript >=4.8.4 <6.1.0`;
      # TypeScript 7 crashes ESLint on startup. Drop this once
      # typescript-eslint supports 7.
      - dependency-name: "typescript"
        versions: [">=7"]

  # Ticket 30: keep the SHA-pinned actions in .github/workflows current.
  # Minor/patch bumps arrive as one grouped PR; majors stay separate.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
